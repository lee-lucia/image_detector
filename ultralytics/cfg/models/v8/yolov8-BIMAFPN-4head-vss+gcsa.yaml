# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.9 GFLOPs
  s: [0.33, 0.50, 1024]  # YOLOv8s summary: 225 layers, 11166560 parameters, 11166544 gradients,  28.8 GFLOPs
  m: [0.67, 0.75, 768]   # YOLOv8m summary: 295 layers, 25902640 parameters, 25902624 gradients,  79.3 GFLOPs
  l: [1.00, 1.00, 512]   # YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPs
  x: [1.00, 1.25, 512]   # YOLOv8x summary: 365 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPs
fusion_mode: concat
node_mode: C2f
head_channel: 256

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, VSSBlock_YOLO1, [512]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, VSSBlock_YOLO1, [1024]]
  - [-1, 1, SPPF, [1024, 5]]  # 9

# YOLOv8.0n head
head:
  - [2, 1, Conv, [head_channel]]  # 10-P2/8
  - [4, 1, Conv, [head_channel]]  # 11-P3/8
  - [6, 1, Conv, [head_channel]]  # 12-P4/16
  - [9, 1, Conv, [head_channel]]  # 13-P5/32

  - [12, 1, Conv, [head_channel, 3, 2]] # 14-P5/32
  - [[-1, 13], 1, Fusion, [fusion_mode]] # 15
  - [-1, 3, node_mode, [head_channel]] # 16-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17-P4/16
  - [11, 1, Conv, [head_channel, 3, 2]] # 18-P4/16
  - [[-1, -2, 12], 1, Fusion, [fusion_mode]] # 19
  - [-1, 3, node_mode, [head_channel]] # 20-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 21-P3/8
  - [10, 1, Conv, [head_channel, 3, 2]] # 22-P3/8
  - [[-1, -2, 11], 1, Fusion, [fusion_mode]] # 23
  - [-1, 3, node_mode, [head_channel]] # 24-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 25-P2/8
  - [[-1, 10], 1, Fusion, [fusion_mode]] # 26
  - [-1, 3, node_mode, [head_channel]] # 27-P2/8
  
  - [[25, -1], 1, Fusion, [fusion_mode]] # 28
  - [-1, 3, node_mode, [head_channel]] # 29-P2/8  head 1
  - [-1, 1, GCSA, [256]] # 30
  
  - [27, 1, Conv, [head_channel, 3, 2]] # 31-P3/16
  - [30, 1, Conv, [head_channel, 3, 2]] # 32-P3/16!qasw 2QW
  - [[-1, -2, 21, 24], 1, Fusion, [fusion_mode]] # 33-P3/16
  - [-1, 3, node_mode, [head_channel]] # 34-P3/16  head 2
  - [-1, 1, GCSA, [256]] # 35

  - [24, 1, Conv, [head_channel, 3, 2]] # 36-P4/16
  - [35, 1, Conv, [head_channel, 3, 2]] # 37-P4/16
  - [[-1, -2, 20, 17], 1, Fusion, [fusion_mode]] # 38-P4/16
  - [-1, 3, node_mode, [head_channel]] # 39-P4/16   head 3
  - [-1, 1, GCSA, [256]] # 40
    
  - [20, 1, Conv, [head_channel, 3, 2]] # 41-P5/32
  - [40, 1, Conv, [head_channel, 3, 2]] # 42-P5/32
  - [[-1, -2, 16], 1, Fusion, [fusion_mode]] # 43-P5/32
  - [-1, 3, node_mode, [head_channel]] # 44-P5/32  head 4
  - [-1, 1, GCSA, [256]] # 45

  - [[30, 35, 40, 45], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)